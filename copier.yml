_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: "Project name, as shown in the app (e.g. Acme App)"

project_slug:
  type: str
  help: "Project slug: lowercase with dashes, used for folders, URLs and the Keycloak realm (e.g. acme-app)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

package_name:
  type: str
  help: "Python package name: lowercase with underscores (e.g. acme_app)"
  default: "{{ project_slug | replace('-', '_') }}"

author_name:
  type: str
  help: Your full name

author_email:
  type: str
  help: Your email address

python_version:
  type: str
  help: Python version for the backend
  default: "3.14"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

db_name:
  type: str
  help: Postgres database name
  default: "{{ package_name }}"

db_user:
  type: str
  help: Postgres user
  default: "{{ package_name }}"

db_password:
  type: str
  help: Postgres password (not stored in the answers file)
  default: "changeme"
  secret: true

db_host:
  type: str
  help: Database host for local/host runs and external DBs (Docker Compose uses the internal 'db' service regardless)
  default: "localhost"

db_port:
  type: int
  help: Database port
  default: 5432

backend_port:
  type: int
  help: Host port for the backend API
  default: 8000

frontend_port:
  type: int
  help: Host port for the frontend
  default: 3000

keycloak_port:
  type: int
  help: Host port for Keycloak in local development
  default: 8080

keycloak_admin_password:
  type: str
  help: Keycloak admin console password (not stored in the answers file)
  default: "admin"
  secret: true

keycloak_client_secret:
  type: str
  help: OIDC client secret shared by Keycloak and the SvelteKit server (not stored in the answers file)
  default: "change-me-client-secret"
  secret: true

domain:
  type: str
  help: Deployment domain
  default: "localhost"

bootstrap:
  type: bool
  help: Run uv sync, bun install and install Playwright's Chromium after generation
  default: false

_tasks:
  - "git init -q"
  - command: "uv sync"
    working_directory: "backend"
    when: "{{ bootstrap }}"
  - command: "bun install"
    working_directory: "frontend"
    when: "{{ bootstrap }}"
  - command: "bunx playwright install chromium"
    working_directory: "frontend"
    when: "{{ bootstrap }}"
